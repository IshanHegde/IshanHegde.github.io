<head>

  <style>
    :root {
      --text: #1a1a1a;
      --bg: #ffffff;
      --accent: #2563eb;

    @media (prefers-color-scheme: dark) {
      :root {
        --text: #e5e5e5;
        --bg: #121212;
        --accent: #60a5fa;
        --muted: #999;
      }
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      line-height: 1.6;
      color: var(--text);
      background: var(--bg);
      max-width: 700px;
      margin: 0 auto;
      padding: 3rem 1.5rem;
    }
    a { color: var(--accent); }
    h1 { margin-bottom: 0.2rem; }
    .tagline { color: var(--muted); margin-top: 0; }
    nav { margin: 1.5rem 0; }
    nav a { margin-right: 1rem; text-decoration: none; }
    section { margin: 2.5rem 0; }
    footer {
      margin-top: 4rem;
      color: var(--muted);
      font-size: 0.9rem;
      border-top: 1px solid var(--muted);
      padding-top: 1rem;
    }
  </style>
</head>
